services:
  postgres:
    image: postgres:15-alpine
    container_name: match_me_db
    environment:
      POSTGRES_USER: match_me_user
      POSTGRES_PASSWORD: match_me_password
      POSTGRES_DB: match_me
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: